<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" role="img" aria-label="Wardrobe Hub Monogram">
  <title>Wardrobe Hub Monogram</title>
  <desc>Wardrobe Hub monogram badge with gold hook and cream WH letters</desc>

  <!-- Monogram Badge -->
  <rect x="0" y="0" width="160" height="160" rx="32" fill="#1C1C1C" stroke="#BFA88A" stroke-width="4" />
  
  <!-- Hanger Hook (Gold / Bronze) -->
  <path d="M80 42 V36 A8 8 0 1 0 72 28" fill="none" stroke="#BFA88A" stroke-width="5" stroke-linecap="round" />
  
  <!-- Letter W -->
  <path d="M22 58 L34 116 L49 78 L64 116 L76 58" fill="none" stroke="#F5F1EB" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Letter H -->
  <path d="M96 58 V116 M136 58 V116 M96 87 H136" fill="none" stroke="#F5F1EB" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
</svg>
