<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 160" width="100%" height="100%" role="img" aria-label="Wardrobe Hub Logo">
  <title>Wardrobe Hub Logo</title>
  <desc>Wardrobe Hub logo featuring a black monogram badge with gold hook and cream WH letters, followed by bold WARDROBE HUB wordmark</desc>

  <!-- Monogram Badge -->
  <rect x="0" y="0" width="160" height="160" rx="32" fill="#111111" />
  
  <!-- Hanger Hook (Gold / Bronze) -->
  <path d="M80 42 V36 A8 8 0 1 0 72 28" fill="none" stroke="#BFA88A" stroke-width="5" stroke-linecap="round" />
  
  <!-- Letter W -->
  <path d="M22 58 L34 116 L49 78 L64 116 L76 58" fill="none" stroke="#F5F1EB" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Letter H -->
  <path d="M96 58 V116 M136 58 V116 M96 87 H136" fill="none" stroke="#F5F1EB" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bold Brand Name -->
  <text x="185" y="85" dominant-baseline="central" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="800" letter-spacing="3" fill="#111111">WARDROBE <tspan fill="#8A6F4E">HUB</tspan></text>
</svg>